<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>個人成績票作成システム</title>
  <!-- PapaParse（CSV解析用） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <!-- html2pdf.js（個票PDF化用） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #eef2f5;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    /* 操作エリア（印刷時非表示） */
    .no-print {
      max-width: 900px;
      margin: 0 auto 30px;
      background: #fff;
      padding: 20px 25px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .setting-group {
      display: flex;
      gap: 15px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .setting-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .drop-zone {
      border: 2px dashed #2563eb;
      border-radius: 6px;
      padding: 18px;
      background: #eff6ff;
      text-align: center;
      cursor: pointer;
      margin: 12px 0;
    }
    .drop-zone:hover {
      background: #dbeafe;
    }
    .btn {
      padding: 8px 18px;
      font-size: 14px;
      font-weight: bold;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn-pdf {
      padding: 4px 10px;
      font-size: 11px;
      font-weight: bold;
      background: #059669;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    .btn-pdf:hover {
      background: #047857;
    }
    .input-text, .select-box {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: inherit;
    }

    /* 正答率調整エリア */
    .rate-config-box {
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      padding: 12px;
      margin-top: 15px;
      max-height: 180px;
      overflow-y: auto;
      border-radius: 6px;
    }
    .rate-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 6px;
      margin-top: 8px;
    }
    .rate-item {
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #ddd;
      padding: 2px 6px;
      background: #fff;
      border-radius: 3px;
    }
    .rate-item input {
      width: 45px;
      text-align: right;
      padding: 2px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }

    /* 各受検者カードラッパー */
    .card-wrapper {
      position: relative;
      width: 210mm;
      margin: 0 auto 30px;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .card-tools {
      position: absolute;
      top: -28px;
      right: 0;
      display: flex;
      gap: 8px;
    }

    /* 成績個票のスタイル（A4安全サイズ: 210mm x 285mm） */
    .report-card {
      width: 210mm;
      height: 285mm;
      background: #ffffff !important;
      padding: 10mm 12mm;
      border: 1px solid #bbb;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      position: relative;
      overflow: hidden;
      page-break-inside: avoid;
      break-inside: avoid;
      page-break-after: always;
      break-after: page;

      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    .card-header {
      border-bottom: 2px solid #2563eb;
      padding-bottom: 5px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .card-header h1 {
      margin: 0;
      font-size: 18px;
      color: #1e3a8a;
    }
    .student-badge {
      font-size: 14px;
      font-weight: bold;
      border: 1px solid #2563eb;
      padding: 3px 10px;
      background: #eff6ff !important;
      border-radius: 4px;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* 統計テーブル */
    .stats-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 8px;
    }
    .stats-table th, .stats-table td {
      border: 1px solid #94a3b8;
      padding: 4px 2px;
      text-align: center;
    }
    .stats-table th {
      background: #f1f5f9 !important;
      font-size: 10px;
      color: #334155;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .stats-table td {
      font-size: 15px;
      font-weight: bold;
    }
    .stats-table td.highlight {
      color: #2563eb !important;
      background: #eff6ff !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    .section-title {
      font-size: 11px;
      font-weight: bold;
      color: #1e293b;
      border-left: 3px solid #2563eb;
      padding-left: 6px;
      margin: 10px 0 5px;
    }

    .comment-box {
      border: 1px solid #cbd5e1;
      padding: 6px 10px;
      font-size: 10px;
      line-height: 1.4;
      background: #f8fafc !important;
      border-radius: 4px;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* 2列レイアウト用コンテナ */
    .details-container {
      display: flex;
      gap: 12px;
      margin-top: 5px;
    }
    .details-column {
      flex: 1;
    }

    /* 明細テーブル */
    .details-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 9px;
    }
    .details-table th, .details-table td {
      border: 1px solid #cbd5e1;
      padding: 3px 4px;
      text-align: left;
    }
    .details-table th {
      background: #f1f5f9 !important;
      text-align: center;
      font-size: 8.5px;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* 正誤記号の装飾 */
    .judge-mark {
      font-weight: bold;
      font-size: 11px;
    }
    .judge-mark.circle {
      color: #16a34a !important; /* 丸：緑 */
    }
    .judge-mark.triangle {
      color: #d97706 !important; /* 三角：オレンジ */
    }
    .judge-mark.cross {
      color: #dc2626 !important; /* バツ：赤 */
    }

    /* バーグラフ */
    .bar-container {
      width: 100%;
      background-color: #e2e8f0 !important;
      height: 9px;
      border-radius: 0px;
      overflow: hidden;
      display: block;
      border: 1px solid #cbd5e1;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .bar-fill {
      height: 100%;
      background-color: #2563eb !important;
      border-radius: 0px;
      display: block;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* 印刷用スタイル */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }
      html, body {
        width: 210mm;
        height: 100%;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print, .card-tools {
        display: none !important;
      }
      .card-wrapper {
        margin: 0 !important;
        padding: 0 !important;
        width: 210mm !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      .report-card {
        box-shadow: none !important;
        border: none !important;
        margin: 0 !important;
        width: 210mm !important;
        height: 285mm !important;
        padding: 10mm 12mm !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        page-break-after: always !important;
        break-after: page !important;
      }
    }
  </style>
</head>
<body>

  <div class="no-print">
    <h2 style="margin-top: 0; border-bottom: 2px solid #2563eb; padding-bottom: 5px;">個人成績票作成システム</h2>
    
    <div class="setting-group">
      <div class="setting-item">
        <label><b>試験名称: </b></label>
        <input type="text" id="examTitle" class="input-text" value="学力到達度測定試験" style="width: 160px;">
      </div>
      <div class="setting-item">
        <label><b>発行元名: </b></label>
        <input type="text" id="organizerName" class="input-text" value="試験実行委員会" style="width: 160px;">
      </div>
    </div>

    <div class="setting-group" id="columnSelectContainer" style="display: none; background: #f8fafc; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px;">
      <div class="setting-item">
        <label><b>「総得点」列: </b></label>
        <select id="scoreKeySelect" class="select-box" onchange="updateQuestionKeysAndRender()" style="max-width: 180px;"></select>
      </div>
      <div class="setting-item">
        <label><b>「氏名」列: </b></label>
        <select id="nameKeySelect" class="select-box" onchange="updateQuestionKeysAndRender()" style="max-width: 180px;"></select>
      </div>
      <div class="setting-item">
        <label><b>「問1 (最初の問題)」列: </b></label>
        <select id="firstQuestionSelect" class="select-box" onchange="updateQuestionKeysAndRender()" style="max-width: 220px;"></select>
      </div>
    </div>

    <div class="drop-zone" id="dropZone">
      <p style="margin: 0; font-weight: bold;">【① GoogleフォームのCSVをドロップ】</p>
      <p style="font-size: 11px; color: #666; margin: 3px 0 0;">またはクリックして選択</p>
      <input type="file" id="fileInput" accept=".csv" style="display:none;">
    </div>

    <!-- 正答率調整エリア -->
    <div id="rateConfigContainer" style="display: none;" class="rate-config-box">
      <div style="font-weight: bold; font-size: 11px; border-bottom: 1px solid #ccc; padding-bottom: 3px;">
        【② 全体正答率（%）の確認・手動調整】
      </div>
      <div class="rate-grid" id="rateGrid"></div>
      <button class="btn" onclick="renderReportCards()" style="margin-top: 8px; width: 100%; padding: 5px;">再生成する</button>
    </div>

    <div style="text-align: center; margin-top: 15px;">
      <button class="btn" onclick="renderReportCards()" style="background: #475569; margin-right: 10px;">設定反映</button>
      <button class="btn" onclick="window.print()">一括印刷 / 全体PDF出力</button>
    </div>
  </div>

  <div id="output"></div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    let globalParsedData = null;
    let questionKeysGlobal = [];

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => e.preventDefault());
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          globalParsedData = results.data;
          setupColumnSelects(results.data);
          updateQuestionKeysAndRender();
        }
      });
    }

    function setupColumnSelects(data) {
      if (!data || data.length === 0) return;
      const headers = Object.keys(data[0]);

      const scoreSelect = document.getElementById('scoreKeySelect');
      const nameSelect = document.getElementById('nameKeySelect');
      const firstQSelect = document.getElementById('firstQuestionSelect');

      scoreSelect.innerHTML = '';
      nameSelect.innerHTML = '';
      firstQSelect.innerHTML = '';

      let detectedScoreKey = headers.find(h => h.includes('総得点') || h.includes('スコア')) || headers[1];
      let detectedNameKey = headers.find(h => 
        (h.includes('表示名') || h.includes('氏名') || h.includes('名前') || h.includes('回答者') || h.toLowerCase().includes('name')) &&
        !h.includes('[スコア]') && !h.includes('[フィードバック]') && !h.includes('タイムスタンプ') && !h.includes('総得点')
      ) || headers[2];

      let detectedFirstQ = headers.find(h => 
        !h.includes('タイムスタンプ') && 
        !h.includes('総得点') && 
        !h.includes('表示名') && 
        !h.includes('LINEの名前') &&
        !h.includes('名前') && 
        !h.includes('氏名') &&
        !h.includes('[スコア]') &&
        !h.includes('[フィードバック]')
      ) || headers[8] || headers[0];

      headers.forEach(h => {
        if (!h.endsWith(' [フィードバック]') && !h.endsWith(' [スコア]')) {
          const optScore = new Option(h.replace(/\n/g, ' '), h);
          if (h === detectedScoreKey) optScore.selected = true;
          scoreSelect.add(optScore);

          const optName = new Option(h.replace(/\n/g, ' '), h);
          if (h === detectedNameKey) optName.selected = true;
          nameSelect.add(optName);

          const optFirst = new Option(h.replace(/\n/g, ' '), h);
          if (h === detectedFirstQ) optFirst.selected = true;
          firstQSelect.add(optFirst);
        }
      });

      document.getElementById('columnSelectContainer').style.display = 'flex';
    }

    function updateQuestionKeysAndRender() {
      if (!globalParsedData) return;
      const headers = Object.keys(globalParsedData[0]);

      const firstQKey = document.getElementById('firstQuestionSelect').value;
      const startIndex = headers.indexOf(firstQKey);

      if (startIndex === -1) return;

      const baseKeys = [];
      for (let i = startIndex; i < headers.length; i++) {
        let h = headers[i];
        if (h.endsWith(' [スコア]')) {
          let base = h.replace(' [スコア]', '');
          if (!baseKeys.includes(base)) baseKeys.push(base);
        } else if (!h.endsWith(' [フィードバック]') && !headers.includes(h + ' [スコア]')) {
          if (!baseKeys.includes(h)) baseKeys.push(h);
        }
      }

      questionKeysGlobal = baseKeys;

      const rateGrid = document.getElementById('rateGrid');
      rateGrid.innerHTML = '';
      const totalStudents = globalParsedData.length;

      questionKeysGlobal.forEach((qKey, idx) => {
        let scoreCol = qKey + ' [スコア]';
        let calculatedRate = "50.0";

        if (headers.includes(scoreCol) && totalStudents > 0) {
          let correctCount = 0;
          globalParsedData.forEach(row => {
            let scoreVal = row[scoreCol] || '0';
            let earned = parseFloat(scoreVal.split('/')[0].trim()) || 0;
            if (earned > 0) correctCount++;
          });
          calculatedRate = ((correctCount / totalStudents) * 100).toFixed(1);
        } else {
          calculatedRate = (Math.floor(Math.random() * 400) / 10 + 20.0).toFixed(1);
        }

        const item = document.createElement('div');
        item.className = 'rate-item';
        item.innerHTML = `
          <span>問${idx + 1}:</span>
          <div>
            <input type="number" id="rate-input-${idx}" step="0.1" min="0" max="100" value="${calculatedRate}">%
          </div>
        `;
        rateGrid.appendChild(item);
      });

      document.getElementById('rateConfigContainer').style.display = 'block';
      renderReportCards();
    }

    function calculateMedian(numbers) {
      const sorted = [...numbers].sort((a, b) => a - b);
      const middle = Math.floor(sorted.length / 2);
      if (sorted.length % 2 === 0) {
        return (sorted[middle - 1] + sorted[middle]) / 2;
      }
      return sorted[middle];
    }

    function renderReportCards() {
      if (!globalParsedData) return;

      const output = document.getElementById('output');
      output.innerHTML = '';

      const examTitle = document.getElementById('examTitle').value || "学力評価試験";
      const organizerName = document.getElementById('organizerName').value || "試験実行委員会";
      
      const selectedScoreKey = document.getElementById('scoreKeySelect').value;
      const selectedNameKey = document.getElementById('nameKeySelect').value;

      const totalStudents = globalParsedData.length;

      const customRates = questionKeysGlobal.map((_, idx) => {
        const input = document.getElementById(`rate-input-${idx}`);
        return input ? parseFloat(input.value || 0).toFixed(1) : "50.0";
      });

      const students = globalParsedData.map((row, index) => {
        let scoreRaw = row[selectedScoreKey] || '0';
        let score = parseFloat(scoreRaw.split('/')[0].trim()) || 0;
        let maxScore = parseFloat(scoreRaw.split('/')[1]?.trim()) || 100;
        return {
          id: index + 1,
          name: row[selectedNameKey] || `受検者_${index + 1}`,
          score: score,
          maxScore: maxScore,
          answers: row
        };
      });

      const scores = students.map(s => s.score);
      const totalScore = scores.reduce((a, b) => a + b, 0);
      const avg = totalScore / scores.length;
      const median = calculateMedian(scores);
      const variance = scores.reduce((a, b) => a + Math.pow(b - avg, 2), 0) / scores.length;
      const stdDev = Math.sqrt(variance) || 1;
      const sortedScores = [...scores].sort((a, b) => b - a);

      students.forEach((student, studentIndex) => {
        const deviation = (50 + 10 * (student.score - avg) / stdDev).toFixed(1);
        const rank = sortedScores.indexOf(student.score) + 1;

        const wrapper = document.createElement('div');
        wrapper.className = 'card-wrapper';

        const card = document.createElement('div');
        card.className = 'report-card';
        card.id = `report-card-${studentIndex}`;
        
        const halfLength = Math.ceil(questionKeysGlobal.length / 2);
        const col1Keys = questionKeysGlobal.slice(0, halfLength);
        const col2Keys = questionKeysGlobal.slice(halfLength);

        // 得点・正誤（〇△×）・正答率・グラフを並べたテーブル生成関数
        const generateTableRows = (keys, offset) => {
          let rows = '';
          keys.forEach((qKey, idx) => {
            let actualIdx = offset + idx;
            let rate = parseFloat(customRates[actualIdx] || "50.0");
            let scoreVal = student.answers[qKey + ' [スコア]'] || '';

            let scoreText = '-';
            let markHtml = '<span class="judge-mark">-</span>';

            if (scoreVal && scoreVal.includes('/')) {
              let pts = scoreVal.split('/');
              let earned = parseFloat(pts[0].trim()) || 0;
              let maxPts = parseFloat(pts[1].trim()) || 0;
              scoreText = `${earned}/${maxPts}点`;

              // 正誤判定ロジック（満点＝〇、部分点＝△、0点＝×）
              if (maxPts > 0) {
                if (earned >= maxPts) {
                  markHtml = '<span class="judge-mark circle">〇</span>';
                } else if (earned > 0) {
                  markHtml = '<span class="judge-mark triangle">△</span>';
                } else {
                  markHtml = '<span class="judge-mark cross">×</span>';
                }
              }
            }

            rows += `
              <tr>
                <td style="text-align: center; width: 14%; font-weight: bold;">問${actualIdx + 1}</td>
                <td style="text-align: center; width: 14%;">${markHtml}</td>
                <td style="text-align: center; width: 22%; font-size: 8.5px; font-weight: bold;">${scoreText}</td>
                <td style="text-align: center; width: 20%; font-weight: bold; color: #2563eb;">${rate.toFixed(1)}%</td>
                <td style="width: 30%; vertical-align: middle;">
                  <div class="bar-container">
                    <div class="bar-fill" style="width: ${rate}%;"></div>
                  </div>
                </td>
              </tr>
            `;
          });
          return rows;
        };

        card.innerHTML = `
          <div class="card-header">
            <div>
              <div style="font-size: 10px; color: #64748b; font-weight: bold;">個人成績票</div>
              <h1>${escapeHtml(examTitle)}</h1>
            </div>
            <div class="student-badge">氏名: ${escapeHtml(student.name)} 殿</div>
          </div>

          <table class="stats-table">
            <thead>
              <tr>
                <th style="width: 20%;">得点 / 満点</th>
                <th style="width: 16%;">平均点</th>
                <th style="width: 16%;">中央値</th>
                <th style="width: 16%;">標準偏差</th>
                <th style="width: 16%;">偏差値</th>
                <th style="width: 16%;">順位</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>${student.score} / ${student.maxScore}</td>
                <td>${avg.toFixed(1)}</td>
                <td>${median.toFixed(1)}</td>
                <td>${stdDev.toFixed(1)}</td>
                <td class="highlight">${deviation}</td>
                <td>${rank} / ${students.length}</td>
              </tr>
            </tbody>
          </table>

          <div class="section-title">【学習所見・講評】</div>
          <div class="comment-box">
            <b>■ 総合評価 (偏差値: ${deviation})</b><br>
            ${getComment(parseFloat(deviation))}
          </div>

          <div class="section-title">【設問別 成績・正誤・正答率分布】</div>
          <div class="details-container">
            <!-- 左列 -->
            <div class="details-column">
              <table class="details-table">
                <thead>
                  <tr>
                    <th>番号</th>
                    <th>正誤</th>
                    <th>個人得点</th>
                    <th>正答率</th>
                    <th>分布グラフ</th>
                  </tr>
                </thead>
                <tbody>
                  ${generateTableRows(col1Keys, 0)}
                </tbody>
              </table>
            </div>
            <!-- 右列 -->
            <div class="details-column">
              <table class="details-table">
                <thead>
                  <tr>
                    <th>番号</th>
                    <th>正誤</th>
                    <th>個人得点</th>
                    <th>正答率</th>
                    <th>分布グラフ</th>
                  </tr>
                </thead>
                <tbody>
                  ${generateTableRows(col2Keys, halfLength)}
                </tbody>
              </table>
            </div>
          </div>
          
          <div style="position: absolute; bottom: 8mm; right: 12mm; font-size: 9px; color: #64748b; text-align: right;">
            全体受検者数: ${totalStudents}名 / 発行: ${escapeHtml(organizerName)}
          </div>
        `;

        wrapper.appendChild(card);

        // 個別PDFダウンロードボタン
        const tools = document.createElement('div');
        tools.className = 'card-tools no-print';
        tools.innerHTML = `
          <button class="btn-pdf" onclick="downloadSinglePDF('${studentIndex}', '${escapeHtml(student.name)}')">📄 この人のPDFをダウンロード</button>
        `;
        wrapper.appendChild(tools);

        output.appendChild(wrapper);
      });
    }

    // PDF出力関数
    function downloadSinglePDF(cardIndex, studentName) {
      const element = document.getElementById(`report-card-${cardIndex}`);
      const opt = {
        margin: 0,
        filename: `${studentName}_成績個人票.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { 
          scale: 2, 
          useCORS: true, 
          scrollY: 0,
          backgroundColor: '#ffffff'
        },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: 'avoid-all' }
      };
      html2pdf().set(opt).from(element).save();
    }

    function getComment(dev) {
      if (dev >= 65) {
        return "素晴らしい結果です！応用問題までしっかり手が届いています。自信を持ってこの調子を維持していきましょう。";
      } else if (dev >= 55) {
        return "良好な成績です。基礎知識は定着しているので、間違えた設問を再確認してさらに高みを目指しましょう。";
      } else if (dev >= 45) {
        return "平均的な成果です。基本的な問題の取りこぼしがないか見直しを行い、確実に解ける問題を増やしましょう。";
      } else if (dev >= 35) {
        return "少し苦戦したようです。まずは間違えた基礎的な問題からしっかり復習して理解を深めていきましょう。";
      } else {
        return "もう一度基礎から丁寧に確認しましょう。諦めずに1問ずつ理解を重ねていくことが大切です。";
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
