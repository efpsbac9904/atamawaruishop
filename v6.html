<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Train Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Inter', sans-serif; touch-action: none; user-select: none; }
        canvas { display: block; }
        
        body::after {
            content: "";
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 10;
        }

        #hud {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            padding: calc(env(safe-area-inset-top) + 10px) 15px calc(env(safe-area-inset-bottom) + 15px) 15px;
            z-index: 20;
        }

        .panel {
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            color: #fff;
            padding: 10px 14px;
        }

        .settings-btn {
            pointer-events: auto;
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #settings-modal {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 110;
        }

        .speed-val {
            font-family: 'Consolas', monospace;
            font-size: 38px;
            font-weight: 900;
            line-height: 1;
            transition: color 0.2s;
        }

        .speed-over { color: #ff4444; text-shadow: 0 0 15px rgba(255,0,0,0.6); }
        .speed-ok { color: #eee; }

        .limit-val {
            font-family: 'Consolas', monospace;
            font-size: 24px;
            font-weight: bold;
            color: #ffcc00;
        }

        .dist-mini {
            font-family: 'Consolas', monospace;
            font-size: 20px;
            font-weight: bold;
            color: #ff4444;
            line-height: 1;
        }

        .time-display {
            font-family: 'Consolas', monospace;
            font-size: 16px;
            font-weight: bold;
        }

        .control-btns {
            display: flex;
            gap: 15px;
            pointer-events: auto;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            height: 70px;
        }

        .btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-weight: 900;
            font-size: 16px;
            transition: all 0.1s;
            backdrop-filter: blur(4px);
        }
        .btn:active { transform: translateY(2px); background: rgba(255, 255, 255, 0.15); }
        .btn-p { border-bottom: 3px solid #10b981; }
        .btn-b { border-bottom: 3px solid #ef4444; }

        .notch-indicator { display: flex; gap: 2px; margin-top: 4px; width: 100%; }
        .notch-step { flex: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 1px; }
        .notch-step.active-p { background: #10b981; }
        .notch-step.active-b { background: #ef4444; }

        #result-modal {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 100;
        }

        .limit-sign {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- 設定モーダル -->
    <div id="settings-modal">
        <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-2xl text-center max-w-sm w-full mx-4 text-white">
            <h2 class="text-lg font-bold mb-6 tracking-wider">SETTINGS</h2>
            
            <div class="text-left mb-6">
                <label class="text-[10px] text-zinc-500 uppercase font-bold tracking-widest block mb-2">FPS Limit</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setFPS(30)" id="fps-30" class="fps-opt border border-zinc-700 py-2 rounded bg-transparent hover:bg-zinc-800 text-sm">30</button>
                    <button onclick="setFPS(60)" id="fps-60" class="fps-opt border border-zinc-700 py-2 rounded bg-transparent hover:bg-zinc-800 text-sm">60</button>
                    <button onclick="setFPS(0)" id="fps-0" class="fps-opt border border-zinc-700 py-2 rounded bg-transparent hover:bg-zinc-800 text-sm">Unlimited</button>
                </div>
            </div>

            <div class="text-left mb-6">
    <label class="text-[10px] text-zinc-500 uppercase font-bold tracking-widest block mb-2">Import Course (JSON)</label>
    <input type="file" id="course-file" class="text-xs text-zinc-400 file:mr-4 file:py-1 file:px-2 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-zinc-800 file:text-zinc-200 hover:file:bg-zinc-700" accept=".json">
</div>

            <button onclick="toggleSettings(false)" class="w-full bg-white text-black py-3 rounded-lg text-sm font-bold">CLOSE</button>
        </div>
    </div>

    <div id="result-modal">
        <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-2xl text-center max-w-sm w-full mx-4 text-white">
            <h2 class="text-[10px] font-bold mb-1 tracking-[0.2em] text-zinc-500">STOPPED</h2>
            <div id="res-dist" class="text-4xl font-black mb-1 tracking-tighter">---</div>
            <div id="res-comment" class="text-sm text-green-400 mb-1 font-bold">---</div>
            <div id="res-time" class="text-xs text-zinc-500 mb-8 font-mono">---</div>
            <div class="flex gap-2">

<button onclick="handleNextStep()" class="flex-1 bg-white text-black py-3 rounded-lg text-sm font-bold">NEXT</button>
            </div>
        </div>
    </div>
       <div id="hud">
    <div id="toast" class="fixed top-10 left-1/2 -translate-x-1/2 bg-black/80 text-white px-6 py-3 rounded-full text-sm font-bold tracking-widest opacity-0 transition-opacity duration-300 z-[100] pointer-events-none border border-white/20"></div>
    
    <div class="flex justify-between items-start">
 
    <div id="hud">
 
        <div class="flex justify-between items-start w-full">
            <div class="panel text-left min-w-[130px]">
                <div class="flex flex-col gap-2">
                    <section>
                        <div class="text-[8px] font-bold text-zinc-500 uppercase mb-0.5">Time</div>
                        <div id="current-time" class="time-display text-white">08:00:00</div>
                        <div class="text-[10px] font-mono text-zinc-500">
                            Target: <span id="target-time" class="text-green-500">--:--</span>
                            <span id="time-diff" class="ml-1">--</span>
                        </div>
                    </section>
                    <div class="h-[1px] bg-white/5"></div>
                    <section>
                        <div class="text-[8px] font-bold text-zinc-500 uppercase mb-0.5">Remaining</div>
                        <div class="dist-mini"><span id="dist-val">---</span> <span class="text-[10px] opacity-50">m</span></div><div class="text-[10px] text-zinc-400 font-bold uppercase tracking-widest mb-1">Next Station</div>
<div id="next-station-name" class="text-lg font-black text-white truncate mb-1">---</div>

                    </section>
                </div>
            </div>

            <div class="flex gap-2">
                <div class="panel limit-sign min-w-[100px]">
                    <div class="text-[8px] font-bold text-zinc-500 mb-1 uppercase tracking-widest">Limit</div>
                    <div class="limit-val" id="limit-val">
                        100</div>
                        <div class="mt-1 flex items-baseline gap-2">
    <span class="text-[10px] text-zinc-500 font-bold uppercase tracking-tighter">Next</span>
    <span id="next-limit-info" class="text-sm text-amber-400 font-black italic">-- km/h in ---m</span>
</div>
                </div>

                
                
                <button class="settings-btn" onclick="toggleSettings(true)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33 1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </div>

            <div class="panel text-center min-w-[140px]">
                <div id="notch-label" class="text-[8px] font-bold text-zinc-500 mb-1 tracking-widest uppercase">Neutral</div>
                <div class="speed-val speed-ok" id="speed-container">
                    <span id="speed-val">0</span><span class="text-[10px] ml-1 text-zinc-500">km/h</span>
                </div>
                <div class="notch-indicator" id="notch-bar"></div>
            </div>
        </div>

        <div></div>

        <div class="control-btns">
            <div class="btn btn-b" id="touch-brake">BRAKE</div>
            <div class="btn btn-p" id="touch-accel">POWER</div>
        </div>
    </div>

    <script>
        const PHYSICS = {
            maxSpeedKmh: 130,      
            pNotches: [0,0.5, 1.3, 1.8, 2.2, 2.5],
            bNotches: [0, -0.35, -0.9, -1.2, -1.5, -2.2, -2.8, -3.5, -4.0, -4.5],
            airResistance: 0.0008, 
            rollingResistance: 0.015, 
        };

        let fpsLimit = 0; 
        let lastFrameTime = 0;
        let frameInterval = 0;

        let currentSpeedKmh = 0;
        let currentNotch = 0; 
        let totalDistanceMeters = 0;
        let nextStationPos = 2500; 
        let currentLimitKmh = 100;
        let isStopped = false;
        let gameTimeSec = 28800;
        let targetTimeSec = 28950;
        let isAutoBraking = false;
let courseStations = []; // 駅リスト
let currentStationIndex = 0; // 今何番目の駅か
let courseSpeedLimits = [];

        let scene, camera, renderer, clock;
        let segments = [];
        const segmentLength = 100;
        let stationModel = null;

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function spawnSegment(z) {
            const group = new THREE.Group();
            const ballast = new THREE.Mesh(
                new THREE.BoxGeometry(11, 0.45, segmentLength), 
                new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.9 })
            );
            ballast.position.set(2.25, 0.22, 0); 
            group.add(ballast);

            const sleeperGeo = new THREE.BoxGeometry(2.6, 0.15, 0.4);
            const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x2a1a0a });
            for(let j = -segmentLength/2; j < segmentLength/2; j += 0.8) {
                const s1 = new THREE.Mesh(sleeperGeo, sleeperMat);
                s1.position.set(0, 0.5, j);
                group.add(s1);
                const s2 = new THREE.Mesh(sleeperGeo, sleeperMat);
                s2.position.set(4.5, 0.5, j);
                group.add(s2);
            }

            const railMat = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.7 });
            [0, 4.5].forEach(offsetX => {
                const r1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.25, segmentLength), railMat);
                r1.position.set(offsetX - 0.73, 0.65, 0);
                const r2 = r1.clone(); r2.position.x = offsetX + 0.73;
                group.add(r1, r2);
            });

            const fenceGeo = new THREE.BoxGeometry(0.08, 1.3, segmentLength);
            const fenceMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const f1 = new THREE.Mesh(fenceGeo, fenceMat); f1.position.set(-6, 1.1, 0);
            const f2 = new THREE.Mesh(fenceGeo, fenceMat); f2.position.set(10.5, 1.1, 0);
            group.add(f1, f2);

            if (z % 50 === 0) {
                const poleBase = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 8), new THREE.MeshStandardMaterial({color: 0x777777}));
                poleBase.position.set(-5, 4, 0);
                group.add(poleBase);
                const poleArm = new THREE.Mesh(new THREE.BoxGeometry(7, 0.15, 0.15), new THREE.MeshStandardMaterial({color: 0x777777}));
                poleArm.position.set(-1.5, 7.5, 0);
                group.add(poleArm);
            }

            for(let k=0; k<12; k++) {
                const side = Math.random() > 0.5 ? 1 : -1;
                const dist = 18 + Math.random() * 40;
                const offsetZ = (Math.random() - 0.5) * segmentLength;
                
                if (Math.random() > 0.4) {
                    const h = 5 + Math.random() * 20;
                    const w = 6 + Math.random() * 6;
                    const bCol = new THREE.Color().setHSL(Math.random(), 0.1, 0.2 + Math.random() * 0.2);
                    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), new THREE.MeshStandardMaterial({color: bCol}));
                    b.position.set(side === 1 ? dist + 10 : -dist - 10, h/2, offsetZ);
                    group.add(b);
                } else {
                    const tHeight = 3 + Math.random() * 4;
                    const tree = new THREE.Group();
                    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, tHeight), new THREE.MeshStandardMaterial({color: 0x3d2b1f}));
                    trunk.position.y = tHeight / 2;
                    tree.add(trunk);
                    const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.5 + Math.random(), 8, 8), new THREE.MeshStandardMaterial({color: 0x2d4c1e}));
                    leaves.position.y = tHeight;
                    tree.add(leaves);
                    tree.position.set(side === 1 ? dist : -dist, 0, offsetZ);
                    group.add(tree);
                }
            }

            group.position.z = z;
            scene.add(group);
            segments.push(group);
        }

        function createStation() {
            if (stationModel) scene.remove(stationModel);
            stationModel = new THREE.Group();
            
            const stationLen = 400;
            const platformMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
            const tactileMat = new THREE.MeshStandardMaterial({ color: 0xccaa00 }); 
            const whiteMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee }); 

            [-1, 1].forEach(side => {
                const platformX = side === -1 ? -8.5 : 13;
                const pWidth = 10;
                const p = new THREE.Mesh(new THREE.BoxGeometry(pWidth, 1.8, stationLen), platformMat);
                p.position.set(platformX, 0.9, -stationLen/2 + 100);
                stationModel.add(p);

                const wLine = new THREE.Mesh(new THREE.PlaneGeometry(0.2, stationLen), whiteMat);
                wLine.rotation.x = -Math.PI / 2;
                wLine.position.set(side === -1 ? platformX + 4.2 : platformX - 4.2, 1.81, -stationLen/2 + 100);
                stationModel.add(wLine);

                const tLine = new THREE.Mesh(new THREE.PlaneGeometry(0.3, stationLen), tactileMat);
                tLine.rotation.x = -Math.PI / 2;
                tLine.position.set(side === -1 ? platformX + 3.7 : platformX - 3.7, 1.81, -stationLen/2 + 100);
                stationModel.add(tLine);

                for (let i = 0; i < stationLen; i += 30) {
                    const pole = new THREE.Mesh(new THREE.BoxGeometry(0.4, 6, 0.4), new THREE.MeshStandardMaterial({color: 0x999999}));
                    pole.position.set(platformX, 3, -i + 100);
                    stationModel.add(pole);

                    const roof = new THREE.Mesh(new THREE.BoxGeometry(pWidth + 1, 0.2, 31), new THREE.MeshStandardMaterial({color: 0x222222}));
                    roof.position.set(platformX, 6, -i + 100);
                    stationModel.add(roof);
                    
                    if (i % 90 === 0) {
                        const sign = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.2, 2.5), new THREE.MeshBasicMaterial({color: 0xffffff}));
                        sign.position.set(side === -1 ? platformX + 4.8 : platformX - 4.8, 3.5, -i + 100);
                        stationModel.add(sign);
                        const signBack = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.4, 2.7), new THREE.MeshStandardMaterial({color: 0x0044aa}));
                        signBack.position.copy(sign.position);
                        stationModel.add(signBack);
                    }
                }
            });

            const targetGroup = new THREE.Group();
            const targetInner = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.1), new THREE.MeshBasicMaterial({color: 0xffffff}));
            targetInner.rotation.z = Math.PI / 4;
            targetGroup.add(targetInner);
            const targetOuter = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.05), new THREE.MeshBasicMaterial({color: 0x000000}));
            targetOuter.rotation.z = Math.PI / 4;
            targetGroup.add(targetOuter);
            targetGroup.position.set(-2.5, 1.5, 0);
            stationModel.add(targetGroup);

           stationModel.position.z = -nextStationPos;
            scene.add(stationModel);
        }

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x94b3e6, 50, 1000);
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 2.8, 0);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);
            
            clock = new THREE.Clock();
            scene.background = new THREE.Color(0x94b3e6);
            
            const sun = new THREE.DirectionalLight(0xffffff, 1.0);
            sun.position.set(50, 100, 50);
            scene.add(sun);
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));

            loadSettings();
            createWorld();
            initUI();
            setupEvents();
            animate(0);
            setNewStationSchedule();
            updateSpeedLimit();
        }

        function loadSettings() {
            const savedFPS = localStorage.getItem('train_sim_fps');
            if (savedFPS !== null) {
                setFPS(parseInt(savedFPS), false);
            } else {
                setFPS(0, false); 
            }
        }

        function toggleSettings(show) {
            document.getElementById('settings-modal').style.display = show ? 'flex' : 'none';
        }

        function setFPS(limit, save = true) {
            fpsLimit = limit;
            frameInterval = limit > 0 ? 1000 / limit : 0;
            
            document.querySelectorAll('.fps-opt').forEach(btn => {
                btn.classList.remove('bg-white', 'text-black');
                btn.classList.add('bg-transparent', 'text-white');
            });
            const activeBtn = document.getElementById(`fps-${limit}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-transparent', 'text-white');
                activeBtn.classList.add('bg-white', 'text-black');
            }

            if (save) {
                localStorage.setItem('train_sim_fps', limit);
            }
        }

        function createWorld() {
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(10000, 10000), new THREE.MeshStandardMaterial({ color: 0x334433 }));
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);
            for(let i=0; i<35; i++) spawnSegment(-i * segmentLength);
            createStation();
        }

function setNewStationSchedule() {
    // JSON読み込み時は何もしない（読み込み処理側でセットするため）
    if (courseSpeedLimits.length > 0) return;

    const avgSpeedMs = 75 / 3.6; 
    targetTimeSec = gameTimeSec + (nextStationPos / avgSpeedMs) + 15;
    const tText = formatTime(targetTimeSec).substring(3);
    document.getElementById('target-time').innerText = tText;
    currentLimitKmh = 100;
    document.getElementById('limit-val').innerText = currentLimitKmh;
}

        function initUI() {
            const bar = document.getElementById('notch-bar');
            bar.innerHTML = '';
            for(let i=-9; i<=5; i++) {
                const d = document.createElement('div');
                d.className = 'notch-step'; d.id = `step-${i}`;
                bar.appendChild(d);
            }
            updateUI();
        }

        function setupEvents() {
            const handle = (d) => { if(!isStopped) { currentNotch = Math.max(-9, Math.min(5, currentNotch + d)); updateUI(); } };
            document.getElementById('touch-accel').onpointerdown = (e) => { e.preventDefault(); handle(1); };
            document.getElementById('touch-brake').onpointerdown = (e) => { e.preventDefault(); handle(-1); };
            document.onkeydown = (e) => {
                if(e.key === 'ArrowUp' || e.key === 'w') handle(1);
                if(e.key === 'ArrowDown' || e.key === 's') handle(-1);
            };
            window.onresize = () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            };

            document.getElementById('course-file').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
try {
    const data = JSON.parse(event.target.result);
    courseStations = data.stations || [];
    currentStationIndex = 0;

    if (courseStations.length > 0) {
        applyStationData(courseStations[0]);
    }
    
    toggleSettings(false);
    showNotification("Course Loaded: " + (data.courseName || "Unknown"));
} catch (err) {
    showNotification("Invalid JSON file.");
}

// 共通のデータ適用関数を追加
function applyStationData(station) {
    // 駅名を更新
    document.getElementById('next-station-name').innerText = station.name || "---";
    // データの更新
    nextStationPos = station.distance;
    targetTimeSec = gameTimeSec + station.targetSeconds;
    courseSpeedLimits = station.speedLimits || [];
    
    // 物理状態と座標を「0」にリセット
    nextStation(); 
    
    // UIをリセット後の数値に強制更新
    const tText = formatTime(targetTimeSec).substring(3);
    document.getElementById('target-time').innerText = tText;
    document.getElementById('dist-val').innerText = nextStationPos.toFixed(1);
    document.getElementById('speed-val').innerText = "0";
    updateSpeedLimit();
}
    };
    reader.readAsText(file);
};
        }
function updateSpeedLimit() {
    let newLimit = 110; 
    let nextLimit = null;
    let nextLimitPos = null;

    if (courseSpeedLimits.length > 0) {
        courseSpeedLimits.forEach((sl, index) => {
            if (totalDistanceMeters >= sl.pos) {
                newLimit = sl.limit;
                // 次の制限があるかチェック
                if (index + 1 < courseSpeedLimits.length) {
                    nextLimit = courseSpeedLimits[index + 1].limit;
                    nextLimitPos = courseSpeedLimits[index + 1].pos;
                }
            }
        });
    }

    currentLimitKmh = newLimit;
    document.getElementById('limit-val').innerText = currentLimitKmh;

    const nextInfoEl = document.getElementById('next-limit-info');
    
    // ここが修正ポイント！
    if (nextLimit !== null) {
        // 次の制限がある場合のみカウントダウンを表示
        const distToNext = Math.ceil(nextLimitPos - totalDistanceMeters);
        nextInfoEl.innerText = `${nextLimit} km/h in ${distToNext}m`;
        nextInfoEl.style.opacity = "1";
    } else {
        // 次の制限がない（あとは駅に止まるだけ）なら「STA 0km/h」または非表示にする
        // 停車駅に向かっている感を出すために 0km/h 予告にするのがおすすめ
        nextInfoEl.innerText = "-";
    }
}

        function updateUI() {
            const label = document.getElementById('notch-label');
            if(currentNotch > 0) label.innerText = `Power P${currentNotch}`;
            else if(currentNotch < 0) label.innerText = currentNotch === -9 ? 'EMERGENCY' : `Brake B${Math.abs(currentNotch)}`;
            else label.innerText = "Coasting";
            for(let i=-9; i<=5; i++) {
                const el = document.getElementById(`step-${i}`); if (!el) continue;
                el.className = 'notch-step';
                if(currentNotch > 0 && i > 0 && i <= currentNotch) el.classList.add('active-p');
                if(currentNotch < 0 && i < 0 && i >= currentNotch) el.classList.add('active-b');
            }
        }

function nextStation() {
    document.getElementById('result-modal').style.display = 'none';
    
    // 1. 走行距離と速度を完全にゼロにする
    totalDistanceMeters = 0; 
    currentSpeedKmh = 0;
    currentNotch = 0;
    isStopped = false;

    // 2. JSONデータがない場合のみランダムにする
if (courseSpeedLimits.length === 0) {
        nextStationPos = 2500 + Math.random() * 1500;
        // JSONなしの時は「NEXT STATION」と表示
        document.getElementById('next-station-name').innerText = "NEXT STATION";
    }

    // 3. 線路（セグメント）の見た目の位置をリセット
    // これをやらないと、前の駅の終わりの位置から始まってしまう
    segments.forEach((seg, i) => {
        seg.position.z = -i * segmentLength;
    });

    // 4. 駅を正しい位置に再配置
    createStation(); 
    
    updateUI();
}

        function animate(currentTime) {
            requestAnimationFrame(animate);

            if (fpsLimit > 0) {
                const delta = currentTime - lastFrameTime;
                if (delta < frameInterval) return;
                lastFrameTime = currentTime - (delta % frameInterval);
            }

            const delta = Math.min(clock.getDelta(), 0.1);

            if (!isStopped) {
                gameTimeSec += delta;

                if (currentSpeedKmh > currentLimitKmh) {
                    // 制限速度を超えたら強制B8発動
                    currentNotch = -8;
                    isAutoBraking = true; // 「システムがかけてるよ」という印
                    updateUI();
                } else if (isAutoBraking && currentSpeedKmh <= currentLimitKmh) {
                    // システムがブレーキをかけていて、かつ制限速度以下になったら解除
                    currentNotch = 0;
                    isAutoBraking = false; // 印を消す
                    updateUI();
                }

                let accel = 0;
                if (currentNotch > 0) accel = PHYSICS.pNotches[currentNotch];
                else if (currentNotch < 0) accel = PHYSICS.bNotches[Math.abs(currentNotch)];
                accel -= (currentSpeedKmh * PHYSICS.airResistance) + PHYSICS.rollingResistance;
                currentSpeedKmh += accel * delta;
                if (currentSpeedKmh < 0) currentSpeedKmh = 0;

                const moveZ = (currentSpeedKmh * 1000 / 3600) * delta;
                totalDistanceMeters += moveZ;

                segments.forEach(seg => {
                    seg.position.z += moveZ;
                    if(seg.position.z > segmentLength) seg.position.z -= segments.length * segmentLength;
                });
                stationModel.position.z += moveZ;

                const dist = nextStationPos - totalDistanceMeters;

               // 読み込んだコースデータから現在の制限速度を決定
// 現在の制限速度を更新
                updateSpeedLimit();

                const speedContainer = document.getElementById('speed-container');
                if (currentSpeedKmh > currentLimitKmh + 1) {
                    speedContainer.className = 'speed-val speed-over';
                } else {
                    speedContainer.className = 'speed-val speed-ok';
                }

                const diff = gameTimeSec - targetTimeSec;
                const diffEl = document.getElementById('time-diff');
                diffEl.innerText = (diff > 0 ? "+" : "") + Math.floor(diff) + "s";
                diffEl.className = diff > 0 ? "text-red-500 ml-1" : "text-blue-400 ml-1";

                document.getElementById('current-time').innerText = formatTime(gameTimeSec);
                document.getElementById('speed-val').innerText = Math.round(currentSpeedKmh);
                document.getElementById('dist-val').innerText = dist.toFixed(1);

                // 停車判定の修正
                // 条件を「速度0」かつ「ある程度走行済み」のみに変更し、
                // リザルト表示のロジックで距離に応じたメッセージを出すようにした
                // 停車判定
                if (currentSpeedKmh === 0 && totalDistanceMeters > 500 && !isStopped) {
                    isStopped = true; // ここで「止まった」フラグを立てる
                    const err = Math.abs(dist);
                    
                    let resultTitle = "";
                    let comment = "";
                    
                    if (err < 0.5) {
                        resultTitle = "EXCELLENT";
                        comment = "Perfectly Stopped!";
                    } else if (dist > 0) {
                        resultTitle = "SHORT";
                        comment = err > 100 ? "Too early..." : "A bit more to go.";
                    } else {
                        resultTitle = "OVERRUN";
                        comment = err > 100 ? "Way too far!" : "Too late!";
                    }

                    document.getElementById('res-dist').innerText = resultTitle;
                    document.getElementById('res-comment').innerText = `${(err).toFixed(2)}m error`;
                    document.getElementById('res-time').innerText = `Scheduled: ${formatTime(targetTimeSec)} / Result: ${formatTime(gameTimeSec)}`;
                    document.getElementById('result-modal').style.display = 'flex';
                }
            }
            
            const v = currentSpeedKmh / 100;
            camera.position.y = 2.8 + Math.sin(Date.now() * 0.01) * 0.002 ;
            camera.rotation.z = Math.sin(Date.now() * 0.005) * 0.0015 ;
            camera.position.x = Math.sin(Date.now() * 0.003) * 0.001 ;
            
            renderer.render(scene, camera);
        }
        
        window.onload = init;
function handleNextStep() {
    // 1. リザルトを隠す
    document.getElementById('result-modal').style.display = 'none';

    // 2. インデックスを進める
    currentStationIndex++;
    
    if (currentStationIndex < courseStations.length) {
        // 3. 次の駅データを適用
        const nextData = courseStations[currentStationIndex];
        
        // 4. ここで applyStationData を呼ぶ。
        // この中の nextStation() で totalDistanceMeters が 0 にリセットされる。
        applyStationData(nextData);

        // 5. 【重要】フラグを最後に false にして動き出せるようにする
        isStopped = false; 
        
    } else {
        showNotification("🎉 COURSE CLEAR!\n全ての駅に到着しました！");
        location.reload(); 
    }
}

// --- 複数駅対応のためのデータ適用関数 ---
function applyStationData(station) {
    // 駅名を更新
    document.getElementById('next-station-name').innerText = station.name || "---";
    if (!station) return;

    // 1. JSONから読み込んだデータをゲーム変数にセット
    nextStationPos = station.distance;
    
    // 目標時刻を計算（現在のゲーム時刻に加算）
    targetTimeSec = gameTimeSec + (station.targetSeconds || 150);
    
    // 速度制限リストを更新
    courseSpeedLimits = station.speedLimits || [];
    
    // 2. 物理状態と座標を「0」にリセット（これで駅を再配置し、距離を0にする）
    nextStation(); 
    
    // 3. UI表示を即座に更新
    const tText = formatTime(targetTimeSec).substring(3);
    document.getElementById('target-time').innerText = tText;
    document.getElementById('dist-val').innerText = nextStationPos.toFixed(1);
    document.getElementById('speed-val').innerText = "0";
    
    // 速度制限の表示も初期化（データがあれば最初の制限を出す）
    if (courseSpeedLimits.length > 0) {
        currentLimitKmh = courseSpeedLimits[0].limit;
        document.getElementById('limit-val').innerText = currentLimitKmh;
    }
    updateSpeedLimit();
}


function showNotification(text) {
    const toast = document.getElementById('toast');
    toast.innerText = text;
    toast.style.opacity = '1';
    
    // 3秒後に消す
    setTimeout(() => {
        toast.style.opacity = '0';
    }, 3000);
}
